spring:
  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}

  data:
    rest:
      default-page-size: 1

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-description: Flyway Scripts
    default-schema: public
    out-of-order: true
    ignore-migration-patterns: "*:ignored"

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  thymeleaf:
    cache: true
    check-template: true
    check-template-location: true
    enabled: true
    encoding: UTF-8

year:
  current: 2026
  next: 2027

response.entity.name:
  restaurants: "restaurants"
  reservations: "reservations"

email:
  subject:
    reservation:
      confirmed: "Reservation is confirmed"
      not-confirmed: "Reservation is not confirmed"
      cancelled: "Reservation is cancelled"

  template-path:
    reservation:
      confirmed: "email_confirmation.html"
      not-confirmed: "email_non_confirmation.html"
      cancelled: "email_annulation.html"

  pattern:
    date: "eeee dd MMMM"

  address-details:
    from: ${MAIL_FROM}
    to: ${MAIL_TO}
    recipient-email: ${MAIL_RECIPIENT}
    language: "En"