spring:

  jpa:
    show-sql: true

    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
        jdbc:
          batch_size: 20

  output:
    ansi:
      enabled: ALWAYS

logging:
  level:
    root: INFO

    org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE   # Hibernate 6
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE   # Hibernate 5

    org.hibernate.engine.jdbc.batch.internal.BatchingBatch: DEBUG

app:
  demo-data:
    enabled: true